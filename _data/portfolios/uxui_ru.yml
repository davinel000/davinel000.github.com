projects:
  - slug: "edit-wars"
    period: "2022-2025"
    title: "Edit Wars"
    subtitle: "Веб-платформа и экспериментальная визуализация данных для проекта о пропагандистских нарративах"
    images:
      - src: "/docs/portfolios/images/2022_editwars/editwars_website_network.png"
        alt: "Edit Wars — интерактивный сетевой граф"
        caption: "Интерактивный граф для исследования структуры нарративов и связанных терминов."
      - src: "/docs/portfolios/images/2022_editwars/editwars_website_linegraph.png"
        alt: "Edit Wars — линейный график на сайте"
        caption: "Веб-визуализация динамики нарратива с привязкой к событиям и публикациям."
      - src: "/docs/portfolios/images/2022_editwars/editwars_dashboard_barcharts.png"
        alt: "Edit Wars — исследовательский интерфейс в Tableau"
        caption: "Исследовательский интерфейс в Tableau для анализа пропагандистских нарративов."
      - src: "/assets/images/portfolio/edit_wars/exhibition/IMG_5745.JPG"
        alt: "Edit Wars — мультимедийная инсталляция"
        caption: "Инсталляционная версия Edit Wars с проецируемыми датавизуализациями в выставочном пространстве."
      - src: "/assets/images/portfolio/edit_wars/exhibition/P6360584.JPG"
        alt: "Edit Wars — выставочная data-art инсталляция"
        caption: "Edit Wars в выставочном формате: данные, проекция и пространственная композиция."
    description:
      - "Edit Wars — междисциплинарный исследовательский проект о языке российской пропаганды для международной аудитории. Его задача — рассказать о пропагандистских нарративах начала 2022 года, их развитии и взаимной связи на живых примерах. Веб-платформа объединяет лонгриды, экспериментальную инфографику и аналитические материалы."
      - "В проекте я отвечал за UX/data direction. Разрабатывал пользовательский маршрут, информационную и визуальную иерархию, логику взаимодействия с сайтом и инсталляцией, а также цветовое кодирование. Макеты ревьюил вместе с командой. Для выставочной версии проектировал проецируемые датавизуализации и их размещение в пространстве."
    role: "UX/data direction, пользовательские маршруты, информационная архитектура, визуализация данных, координация проекта"
    tools: "Figma, Tableau, TouchDesigner, 3d-force-graph, BERTopic"
    team: "Команда Edit Wars"
    links:
      - label: "Сайт Edit Wars"
        url: "https://editwars.org/"

  - slug: "pns-dashboard"
    period: "2023-2025"
    title: "Propaganda Narrative Soundscapes Dashboard"
    subtitle: "Touch-интерфейс для исследовательской data-art инсталляции"
    images:
      - src: "/assets/images/portfolio/edit_wars/pns/pns_interface.png"
        alt: "Propaganda Narrative Soundscapes Dashboard — макет интерфейса в Figma"
        caption: "Макет интерфейса Dashboard в Figma."
      - src: "/assets/images/portfolio/edit_wars/pns/pns_interface_final.png"
        alt: "Propaganda Narrative Soundscapes Dashboard — реализованный интерфейс"
        caption: "Реализованный touch-интерфейс Dashboard в TouchDesigner."
      - src: "/assets/images/portfolio/edit_wars/pns/pns_closeup.png"
        alt: "Propaganda Narrative Soundscapes Dashboard — взаимодействие с touch-интерфейсом"
        caption: "Взаимодействие посетителя с touch-интерфейсом."
      - src: "/assets/images/portfolio/edit_wars/pns/pns_tableview.png"
        alt: "Propaganda Narrative Soundscapes Dashboard — выставочная установка"
        caption: "Dashboard в выставочном формате с сенсорным экраном и наушниками."
      - src: "/assets/images/portfolio/edit_wars/pns/pns_user_system_flow.png"
        alt: "Propaganda Narrative Soundscapes Dashboard — User & System Flow"
        caption: "Схема пользовательского маршрута и системных состояний интерактивной установки."
    description:
      - "Propaganda Narrative Soundscapes Dashboard — интерактивный touch-интерфейс, созданный как продолжение Edit Wars. Посетитель выбирает пропагандистский нарратив, читает поясняющий текст, прослеживает его развитие во времени, фильтрует связанные темы и слушает сонификацию выбранного материала."
      - "В Figma я спроектировал структуру экранов и логику взаимодействия: навигацию, временную шкалу, подачу текста, переключение языков и связь визуализации со звуком. Затем самостоятельно реализовал интерфейс в TouchDesigner. Отдельный исследовательский интерфейс для анализа данных собрал в Tableau."
      - "Dashboard использовался как компактный экранный формат на выставках в Haus der Wissenschaft и на Discuss Data Lab в Universität Bremen."
    role: "UX/UI, логика взаимодействия, визуализация данных, реализация"
    tools: "Figma, Tableau, TouchDesigner, Python"
    team: "Команда Edit Wars"
    links:
      - label: "Discuss Data Lab"
        url: "https://discuss-data.net/cs/eescca/section/blog/discussdatalab-workshop-report/"

  - slug: "easyai"
    period: "2024"
    title: "EasyAI"
    subtitle: "Интерфейс интерактивной AI-станции для публичных библиотек"
    images:
      - src: "/assets/images/portfolio/easyai/carousel/1.png"
        alt: "EasyAI — интерфейс генеративной AI-станции"
        caption: "Рабочий интерфейс EasyAI: выбор истории и стиля, управление параметрами генерации."
      - src: "/assets/images/portfolio/easyai/carousel/2.jpg"
        alt: "EasyAI — установка в городской библиотеке Бремена"
        caption: "Публичная установка EasyAI в городской библиотеке Бремена."
      - src: "/assets/images/portfolio/easyai/carousel/3.png"
        alt: "EasyAI — ранний вариант интерфейса"
        caption: "Один из промежуточных вариантов интерфейса в процессе итераций."
    description:
      - "EasyAI — интерактивная станция для коллективного творчества и генерации изображений в реальном времени на основе рисунков посетителей библиотек. Интерфейс должен был быть понятен детям и при этом давать сотруднику библиотеки контроль над процессом генерации."
      - "Я спроектировал пользовательский flow, iPad/TouchOSC-интерфейс и операторский интерфейс. Определил структуру экранов, механику выбора истории и стиля и основные параметры генерации. После тестов дорабатывал решение по пользовательской обратной связи."
      - "Я также интегрировал TouchDesigner, TouchOSC, TagTool и StreamDiffusion в единое приложение. EasyAI использовался на публичном воркшопе и на выставках; за первые 120 минут пользователи сгенерировали более 30 изображений."
    role: "UX/UI design, interaction design, prototyping, creative development"
    tools: "Figma, TagTool, TouchDesigner, TouchOSC, Python, StreamDiffusion"
    team: "URBANSCREEN GmbH & Co. KG"

  - slug: "i-see-time"
    period: "2025"
    title: "I See Time"
    subtitle: "Операторский интерфейс постоянной медиа-инсталляции"
    images:
      - src: "/assets/images/portfolio/i_see_time/carousel/2.jpg"
        alt: "I See Time — инсталляция на станции Kaohsiung"
        caption: "Постоянная инсталляция I See Time на железнодорожной станции Kaohsiung, Тайвань."
      - src: "/assets/images/portfolio/i_see_time/carousel/6.png"
        alt: "I See Time — операторский интерфейс"
        caption: "Операторский интерфейс для настройки, тестирования и мониторинга системы."
      - src: "/assets/images/portfolio/i_see_time/carousel/8.png"
        alt: "I See Time — параметры и расписание"
        caption: "Управление параметрами системы и сценариями воспроизведения."
    description:
      - "I See Time — постоянная публичная медиа-инсталляция на новой железнодорожной станции Kaohsiung, Тайвань. Четырёхметровые астрономические часы работают 24/7 и интегрируют данные о времени, фазе Луны и погоде с расписанием контента."
      - "Я спроектировал компоновку, управляющие элементы и логику операторского интерфейса. Он объединяет в одном месте ключевые функции настройки, тестирования и управления системой."
      - "Я реализовал интерфейс в TouchDesigner/Python для настройки, тестирования и последующей эксплуатации 24/7-инсталляции."
    role: "UI/UX, логика взаимодействия, системный дизайн, реализация"
    tools: "Figma, TouchDesigner, Python"

