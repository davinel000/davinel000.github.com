projects:
  - slug: "edit-wars"
    period: "2022-2025"
    title: "Edit Wars"
    subtitle: "Веб-платформа и экспериментальная визуализация данных для проекта о пропагандистских нарративах"
    images:
      - src: "/docs/portfolios/images/2022_editwars/editwars_website_network.png"
        alt: "Edit Wars — интерактивный сетевой граф"
        caption: "Интерактивный граф для исследования структуры нарративов и связанных терминов."
      - src: "/docs/portfolios/images/2022_editwars/editwars_website_linegraph.png"
        alt: "Edit Wars — линейный график на сайте"
        caption: "Веб-визуализация динамики нарратива с привязкой к событиям и публикациям."
      - src: "/assets/images/portfolio/edit_wars/exhibition/main.JPG"
        alt: "Edit Wars — мультимедийная инсталляция"
        caption: "Инсталляционная версия Edit Wars с проецируемыми датавизуализациями в выставочном пространстве."
      - src: "/assets/images/portfolio/edit_wars/exhibition/P6360584.JPG"
        alt: "Edit Wars — выставочная data-art инсталляция"
        caption: "Edit Wars в выставочном формате: данные, проекция и пространственная композиция."
    description:
      - "Edit Wars — междисциплинарный исследовательский проект о языке российской пропаганды для международной аудитории. Веб-платформа объединяет лонгриды, экспериментальную инфографику и аналитические материалы. Задача была сделать сложное исследование удобным для чтения и навигации."
      - "В проекте я отвечал за UX/data direction. Разрабатывал пользовательский маршрут, информационную и визуальную иерархию, логику взаимодействия с сайтом и интерактивной инсталляцией, цветовое кодирование и вместе с командой ревьюил макеты. Я также проектировал проецируемые датавизуализации и их размещение в пространстве."
      - "Edit Wars объединил веб-платформу с экспериментальной инфографикой и лонгридами, инструменты анализа медиаданных и серию интерактивных мультимедийных data-art инсталляций."
    role: "UX/data direction, пользовательские маршруты, информационная архитектура, визуализация данных, координация проекта"
    tools: "Figma, Tableau, TouchDesigner, 3d-force-graph, BERTopic"
    team: "Команда Edit Wars"
    links:
      - label: "Сайт Edit Wars"
        url: "https://editwars.org/"

  - slug: "pns-dashboard"
    period: "2023-2025"
    title: "Propaganda Narrative Soundscapes Dashboard"
    subtitle: "Touch-интерфейс для исследовательской data-art инсталляции"
    images:
      - src: "/docs/portfolios/images/2022_editwars/editwars_dashboard_barcharts.png"
        alt: "Propaganda Narrative Soundscapes Dashboard — исследовательский интерфейс"
        caption: "Исследовательский интерфейс для анализа пропагандистских нарративов."
      - src: "/docs/portfolios/images/2022_editwars/editwars_dashboard_words.png"
        alt: "Propaganda Narrative Soundscapes Dashboard — анализ тематик"
        caption: "Один из экранов исследовательского интерфейса."
      - src: "/assets/images/portfolio/edit_wars/hdw/1.jpg"
        alt: "Propaganda Narrative Soundscapes Dashboard — выставочная установка"
        caption: "Dashboard в выставочном формате с сенсорным экраном и сонификацией."
      - src: "/assets/images/portfolio/edit_wars/hdw/2.jpg"
        alt: "Propaganda Narrative Soundscapes Dashboard — физический интерфейс"
        caption: "Физическая установка интерактивного Dashboard во время выставочного показа."
    description:
      - "Propaganda Narrative Soundscapes Dashboard — интерактивный touch-интерфейс, созданный как продолжение Edit Wars. Посетитель может выбрать пропагандистский нарратив, прочитать поясняющий текст, проследить его развитие во времени, фильтровать связанные темы и слушать сонификацию выбранного материала."
      - "Я проектировал исследовательский интерфейс в Tableau и touchscreen-интерфейс dashboard в Figma. Продумал структуру экранов, навигацию, timeline, подачу текста, переключение между языками и связь визуализации со звуковой частью инсталляции. Затем самостоятельно реализовал интерфейс в TouchDesigner."
      - "Dashboard использовался как компактный выставочный и исследовательский формат проекта. Он был представлен в Haus der Wissenschaft в Бремене и на Discuss Data Lab в Universität Bremen."
    role: "UX/UI, логика взаимодействия, визуализация данных, реализация"
    tools: "Figma, Tableau, TouchDesigner, Python"
    team: "Команда Edit Wars"
    links:
      - label: "Discuss Data Lab"
        url: "https://discuss-data.net/cs/eescca/section/blog/discussdatalab-workshop-report/"

  - slug: "easyai"
    period: "2024"
    title: "EasyAI"
    subtitle: "Интерфейс интерактивной AI-станции для публичных библиотек"
    images:
      - src: "/assets/images/portfolio/easyai/carousel/1.png"
        alt: "EasyAI — интерфейс генеративной AI-станции"
        caption: "Рабочий интерфейс EasyAI: выбор истории и стиля, управление параметрами генерации."
      - src: "/assets/images/portfolio/easyai/carousel/2.jpg"
        alt: "EasyAI — установка в городской библиотеке Бремена"
        caption: "Публичная установка EasyAI в городской библиотеке Бремена."
      - src: "/assets/images/portfolio/easyai/carousel/3.png"
        alt: "EasyAI — ранний вариант интерфейса"
        caption: "Один из промежуточных вариантов интерфейса в процессе итераций."
    description:
      - "EasyAI — интерактивная станция для коллективного рисования и генерации изображений в реальном времени на основе рисунков посетителей публичных библиотек. Интерфейс должен был быть понятен детям и одновременно давать преподавателю контроль над процессом генерации."
      - "Я спроектировал пользовательский flow, iPad/TouchOSC-интерфейс и Teacher UI: структуру экранов, выбор истории и стиля, параметры интенсивности и скорости, состояния интерфейса и логику взаимодействия. Работа шла короткими итерациями с тестированием и корректировкой после пользовательской обратной связи."
      - "Помимо UX/UI я участвовал в технической интеграции TouchDesigner, TouchOSC, TagTool и существующих компонентов Stable Diffusion/StreamDiffusion в единое приложение. Интерфейс использовался на публичном воркшопе и в выставочных сценариях; за первые 120 минут пользователи сгенерировали более 30 изображений."
    role: "UX/UI design, interaction design, prototyping, creative development"
    tools: "Figma, TagTool, TouchDesigner, TouchOSC, Python, StreamDiffusion"
    team: "URBANSCREEN GmbH & Co. KG"

  - slug: "i-see-time"
    period: "2025"
    title: "I See Time"
    subtitle: "Операторский интерфейс постоянной медиа-инсталляции"
    images:
      - src: "/assets/images/portfolio/i_see_time/carousel/2.jpg"
        alt: "I See Time — инсталляция на станции Kaohsiung"
        caption: "Постоянная инсталляция I See Time на железнодорожной станции Kaohsiung, Тайвань."
      - src: "/assets/images/portfolio/i_see_time/carousel/6.png"
        alt: "I See Time — операторский интерфейс"
        caption: "Операторский интерфейс для настройки, тестирования и мониторинга системы."
      - src: "/assets/images/portfolio/i_see_time/carousel/8.png"
        alt: "I See Time — параметры и расписание"
        caption: "Управление параметрами системы и сценариями воспроизведения."
    description:
      - "I See Time — постоянная публичная медиа-инсталляция на новой железнодорожной станции Kaohsiung в Тайване: четырёхметровые астрономические часы, работающие 24/7. Система сочетает расписание контента, время суток, фазу Луны и данные о погоде."
      - "Я спроектировал компоновку, управляющие элементы и логику операторского интерфейса. Он позволяет быстро видеть состояние системы, тестировать и симулировать временные и погодные сценарии, управлять параметрами и расписанием контента."
      - "Интерфейс реализован в TouchDesigner/Python и используется для настройки, тестирования и эксплуатации 24/7-инсталляции."
    role: "UI/UX, логика взаимодействия, системный дизайн, реализация"
    tools: "Figma, TouchDesigner, Python"

