projects:
  - slug: "edit-wars"
    period: "2022-2025"
    title: "Edit Wars"
    subtitle: "Исследовательские и публичные интерфейсы для проекта о пропагандистских нарративах"
    images:
      - src: "/docs/portfolios/images/2022_editwars/editwars_website_network.png"
        alt: "Edit Wars — интерактивный сетевой граф"
        caption: "Интерактивный граф для исследования структуры нарративов и связанных терминов."
      - src: "/docs/portfolios/images/2022_editwars/editwars_dashboard_barcharts.png"
        alt: "Edit Wars — исследовательский дашборд"
        caption: "Исследовательский дашборд для анализа корпуса медиазаголовков."
      - src: "/docs/portfolios/images/2022_editwars/editwars_website_linegraph.png"
        alt: "Edit Wars — линейный график на сайте"
        caption: "Веб-визуализация динамики нарратива с привязкой к событиям и публикациям."
    description:
      - "Edit Wars — междисциплинарный исследовательский проект о языке российской пропаганды для международной аудитории. Интерфейсная задача заключалась в том, чтобы один массив данных работал сразу в трёх форматах: как исследовательский инструмент, публичная веб-платформа и интерактивная инсталляция."
      - "В веб-части я занимался UX/data direction: разрабатывал пользовательский маршрут, информационную и визуальную иерархию, требования к взаимодействию и цветовое кодирование, участвовал в совместном ревью макетов. Финальный дизайн и разработка сайта выполнялись совместно проектной командой."
      - "Также я проектировал исследовательские интерфейсы в Tableau и touchscreen-интерфейс Propaganda Narrative Soundscapes Dashboard — от выбора нарратива и чтения текста до фильтрации данных и связи визуальной части со звуковой."
      - "В результате проект объединил сайт с экспериментальной инфографикой, исследовательский инструмент для журналистов и исследователей и серию выставочных показов с интерактивными data-art инсталляциями."
    role: "UX/data direction, пользовательские маршруты, дашборды и touchscreen-интерфейс, координация проекта"
    tools: "Figma, Tableau, TouchDesigner, 3d-force-graph, BERTopic"
    team: "Команда Edit Wars"
    links:
      - label: "Сайт Edit Wars"
        url: "https://editwars.org/"

  - slug: "easyai"
    period: "2024"
    title: "EasyAI"
    subtitle: "Интерфейс интерактивной AI-станции для публичных библиотек"
    images:
      - src: "/assets/images/portfolio/easyai/carousel/1.png"
        alt: "EasyAI — интерфейс генеративной AI-станции"
        caption: "Рабочий интерфейс EasyAI: выбор истории и стиля, управление параметрами генерации."
      - src: "/assets/images/portfolio/easyai/carousel/2.jpg"
        alt: "EasyAI — установка в городской библиотеке Бремена"
        caption: "Публичная установка EasyAI в городской библиотеке Бремена."
      - src: "/assets/images/portfolio/easyai/carousel/3.png"
        alt: "EasyAI — ранний вариант интерфейса"
        caption: "Один из промежуточных вариантов интерфейса в процессе итераций."
    description:
      - "EasyAI — интерактивная станция для коллективного рисования и генерации изображений в реальном времени на основе рисунков посетителей публичных библиотек. Интерфейс должен был быть понятен детям и одновременно давать преподавателю контроль над процессом генерации."
      - "Я спроектировал пользовательский flow, iPad/TouchOSC-интерфейс и Teacher UI: структуру экранов, выбор истории и стиля, параметры интенсивности и скорости, состояния интерфейса и логику взаимодействия. Работа шла короткими итерациями с тестированием и корректировкой после пользовательской обратной связи."
      - "Помимо UX/UI я участвовал в технической интеграции TouchDesigner, TouchOSC, TagTool и существующих компонентов Stable Diffusion/StreamDiffusion в единое приложение. Интерфейс использовался на публичном воркшопе и в выставочных сценариях; за первые 120 минут пользователи сгенерировали более 30 изображений."
    role: "UX/UI design, interaction design, prototyping, creative development"
    tools: "Figma, TagTool, TouchDesigner, TouchOSC, Python, StreamDiffusion"
    team: "URBANSCREEN GmbH & Co. KG"

  - slug: "i-see-time"
    period: "2025"
    title: "I See Time"
    subtitle: "Операторский интерфейс постоянной медиа-инсталляции"
    images:
      - src: "/assets/images/portfolio/i_see_time/carousel/2.jpg"
        alt: "I See Time — инсталляция на станции Kaohsiung"
        caption: "Постоянная инсталляция I See Time на железнодорожной станции Kaohsiung, Тайвань."
      - src: "/assets/images/portfolio/i_see_time/carousel/6.png"
        alt: "I See Time — операторский интерфейс"
        caption: "Операторский интерфейс для настройки, тестирования и мониторинга системы."
      - src: "/assets/images/portfolio/i_see_time/carousel/8.png"
        alt: "I See Time — параметры и расписание"
        caption: "Управление параметрами системы и сценариями воспроизведения."
    description:
      - "I See Time — постоянная публичная медиа-инсталляция на новой железнодорожной станции Kaohsiung в Тайване: четырёхметровые астрономические часы, работающие 24/7. Система сочетает расписание контента, время суток, фазу Луны и данные о погоде."
      - "Я спроектировал компоновку, управляющие элементы и логику операторского интерфейса. Он позволяет быстро видеть состояние системы, тестировать и симулировать временные и погодные сценарии, управлять параметрами и расписанием контента."
      - "Интерфейс реализован в TouchDesigner/Python и используется для настройки, тестирования и эксплуатации 24/7-инсталляции."
    role: "UI/UX, логика взаимодействия, системный дизайн, реализация"
    tools: "Figma, TouchDesigner, Python"

