projects:
  - slug: "easyai"
    period: "2024"
    title: "EasyAI"
    subtitle: "Интерфейс генеративного AI-сервиса для публичного использования"
    images:
      - src: "/assets/images/portfolio/easyai/carousel/1.png"
        alt: "EasyAI — интерфейс генеративного AI-сервиса"
        caption: "Рабочий интерфейс EasyAI: выбор истории и стиля, управление параметрами генерации."
      - src: "/assets/images/portfolio/easyai/carousel/2.jpg"
        alt: "EasyAI — установка в городской библиотеке Бремена"
        caption: "Публичная установка EasyAI в городской библиотеке Бремена."
      - src: "/assets/images/portfolio/easyai/carousel/3.png"
        alt: "EasyAI — ранний вариант интерфейса"
        caption: "Один из промежуточных вариантов интерфейса в процессе итераций."
    description:
      - "EasyAI — интерактивный сервис URBANSCREEN для генерации изображений в реальном времени на основе рисунков посетителей. Интерфейс должен был быть понятен детям и одновременно давать преподавателю или оператору контроль над процессом генерации."
      - "Я спроектировал пользовательский iPad flow и teacher/operator UI: структуру экранов, выбор истории и стиля, параметры интенсивности и скорости, состояния интерфейса и логику взаимодействия. Работа шла короткими итерациями с тестированием и корректировкой после пользовательской обратной связи."
      - "Помимо UX/UI я участвовал в технической интеграции TouchDesigner/TouchOSC и существующих StreamDiffusion-компонентов. В результате интерфейс использовался в публичном воркшопе и выставочной установке."
    role: "UX/UI design, interaction design, prototyping, creative development"
    tools: "Figma, TouchDesigner, TouchOSC, Python, StreamDiffusion"
    team: "URBANSCREEN GmbH & Co. KG"
    metrics: "Публичная установка и воркшоп; более 30 сгенерированных изображений за первые 120 минут работы."

  - slug: "edit-wars"
    period: "2022-2025"
    title: "Edit Wars"
    subtitle: "Research, data и public interfaces для проекта о пропагандистских нарративах"
    images:
      - src: "/docs/portfolios/images/2022_editwars/editwars_website_network.png"
        alt: "Edit Wars — интерактивный сетевой граф"
        caption: "Интерактивный граф для исследования структуры нарративов и связанных терминов."
      - src: "/docs/portfolios/images/2022_editwars/editwars_dashboard_barcharts.png"
        alt: "Edit Wars — исследовательский dashboard"
        caption: "Исследовательский dashboard для анализа корпуса медиазаголовков."
      - src: "/docs/portfolios/images/2022_editwars/editwars_website_linegraph.png"
        alt: "Edit Wars — линейный график на сайте"
        caption: "Веб-визуализация динамики нарратива с привязкой к событиям и публикациям."
    description:
      - "Edit Wars — междисциплинарный исследовательский проект о языке российской пропаганды. Интерфейсная задача состояла в том, чтобы один массив данных работал одновременно как исследовательский инструмент, публичная веб-платформа и интерактивная инсталляция."
      - "Моя роль в веб-части была UX/data direction: я разрабатывал пользовательский маршрут, информационную и визуализационную иерархию, требования к взаимодействию, цветовое кодирование и вместе с командой ревьюил макеты. Финальный визуальный дизайн сайта создавался Люсей Савельевой, разработка — командой проекта."
      - "Отдельно я сам проектировал исследовательские Tableau-интерфейсы и touchscreen-интерфейс Propaganda Narrative Soundscapes Dashboard: выбор нарратива, чтение текста, фильтрацию и связь данных со звуковой частью инсталляции."
    role: "UX/data direction, user flow, dashboard & touchscreen design, project coordination"
    tools: "Figma, Tableau, TouchDesigner, 3d-force-graph, BERTopic"
    team: "Edit Wars team; visual design сайта — Lucy Savelyeva; web implementation — development team"
    links:
      - label: "Проект"
        url: "https://www.slavaromanov.art/2022/editwarsproject"
      - label: "Edit Wars website"
        url: "https://editwars.org/"
      - label: "Исследовательский dashboard"
        url: "https://public.tableau.com/app/profile/viacheslav.romanov/viz/Mediafutures-cleaneddata540k/weeklycount"

  - slug: "i-see-time"
    period: "2025"
    title: "I See Time"
    subtitle: "Операторский интерфейс и control system для постоянной медиа-инсталляции"
    images:
      - src: "/assets/images/portfolio/i_see_time/carousel/5.png"
        alt: "I See Time — интерфейс управления"
        caption: "Операторский интерфейс для настройки и мониторинга постоянной инсталляции."
      - src: "/assets/images/portfolio/i_see_time/carousel/6.png"
        alt: "I See Time — интерфейс и системные параметры"
        caption: "Параметры системы, расписание и управление состояниями."
      - src: "/assets/images/portfolio/i_see_time/carousel/7.png"
        alt: "I See Time — рабочий экран"
        caption: "Один из production-экранов системы."
    description:
      - "I See Time — постоянная публичная медиа-инсталляция URBANSCREEN: цифровые астрономические часы, работающие 24/7 и реагирующие на время суток, фазу Луны, погоду и расписание контента."
      - "Я полностью проектировал layout, controls и interaction logic операторского интерфейса. Его задача — не производить визуальный эффект сам по себе, а быстро объяснять состояние сложной системы, позволять настройщикам менять параметры и облегчать debugging, handover и удалённое обслуживание."
      - "Интерфейс был реализован как часть production-системы на TouchDesigner/Python и использовался для настройки и эксплуатации инсталляции."
    role: "UI/UX design, interaction logic, system design, implementation"
    tools: "Figma, TouchDesigner, Python"
    team: "URBANSCREEN GmbH & Co. KG"
    metrics: "Production interface для постоянной 24/7 инсталляции."

