hero:
  eyebrow: "Привет, это Слава Романов"
  title: "UX/UI и цифровые интерфейсы"
  lede: "Проектирую интерфейсы для сложных данных, интерактивных систем и цифровых продуктов — от пользовательского маршрута и прототипа до работающего инструмента."

profile:
  label: "Профиль"
  title: "Чем я занимаюсь"
  paragraphs:
    - "Я работаю на пересечении визуализации данных, UX/UI и креативной разработки. Чаще всего я работаю с интерфейсами, где нужно сделать понятной сложную систему: исследовательские инструменты, публичные touchscreen-интерфейсы, операторские панели, генеративные AI-сервисы и сайты."
    - "Мой опыт вырос из civic tech, правозащитных исследований и мультимедийных проектов. В Figma я собираю структуру, пользовательские маршруты, вайрфреймы и визуальные макеты; дальше могу работать с разработчиками или сам реализовывать интерактивную часть в TouchDesigner/Python. Там, где это полезно, автоматизирую отдельные процессы с помощью агентных ИИ-инструментов и MCP."
  facts:
    - label: "Инструменты"
      text: "Figma, TouchDesigner, Tableau, Python, Adobe CC; прототипирование, компонентные пресеты, агентные LLM-инструменты и MCP."
    - label: "Проекты"
      text: "Пользовательские маршруты, информационная архитектура, дашборды, touch-интерфейсы, operator panels, data interfaces и прототипы цифровых сервисов."
    - label: "Контекст"
      text: "НКО, civic tech, исследовательские проекты, культурные институции, интерактивные инсталляции, междисциплинарные команды и коммерческие клиенты."

