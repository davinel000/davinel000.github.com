profile:
  label: "Профиль"
  title: "Чем я занимаюсь"
  paragraphs:
    - "Я занимаюсь визуализацией данных, UX/UI и креативной разработкой. Чаще всего работаю с исследовательскими инструментами, публичными touchscreen-интерфейсами, операторскими панелями, генеративными AI-сервисами и сайтами."
    - "Я работал в civic tech, правозащитных исследованиях и мультимедийном продакшене. В Figma собираю структуру и макеты; интерактивную часть при необходимости реализую сам в TouchDesigner/Python, а веб-разработку веду вместе с разработчиками. Рутинные процессы автоматизирую с помощью агентных ИИ-инструментов и MCP."
  facts:
    - label: "Инструменты"
      text: "Figma, TouchDesigner, Tableau, Python, Adobe CC, TouchOSC, агентные ИИ-инструменты и MCP."
    - label: "Что делаю"
      text: "Информационная архитектура, вайрфреймы, прототипы, дашборды, touch-интерфейсы, operator panels и data interfaces."
    - label: "Контекст"
      text: "НКО, civic tech, исследовательские проекты, культурные институции, интерактивные инсталляции, междисциплинарные команды и коммерческие клиенты."

